      - name: Seed journey identities (fixture configuration, never workflow state)
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/journey_identities.sql

      # The journey creates a REAL dossier and opens a REAL workflow in tenant A.
      # That is the point of it — but several SQL suites express "nothing advanced
      # the engine" as a tenant-wide count, so the journey must run AFTER them,
      # not before. Running it last also means a journey failure no longer hides
      # the ~50 suite results behind it.
      - name: Install deps (journey harness)
        run: npm ci

      - name: C-4 journey — Creation to Closure against the real database
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          # The ENV half of every rollout flag. The TENANT half is seeded by
          # journey_identities.sql; the engine requires BOTH, exactly as in
          # production, so neither alone can switch the journey on.
          EFFITRANS_PROCESS_ENGINE_ENABLED: "true"
          EFFITRANS_PROCESS_WORKSPACES_ENABLED: "true"
          EFFITRANS_PROCESS_STRUCTURES_ENABLED: "true"
          EFFITRANS_OPERATIONS_INTAKE_ENABLED: "true"
          EFFITRANS_TRANSIT_EXECUTION_ENABLED: "true"
          EFFITRANS_FINANCE_EXECUTION_ENABLED: "true"
          EFFITRANS_PHYSICAL_INVOICE_DEPOSIT_ENABLED: "true"
          EFFITRANS_COLLECTIONS_ENABLED: "true"
          # C-4 — the SMTP provider, pointed at the disposable sink. These are
          # the ORDINARY provider variables, not test-only switches: the same
          # names a deployment sets to relay through its own mail server.
          COMMUNICATIONS_EMAIL_PROVIDER: "smtp"
          COMMUNICATIONS_EMAIL_FROM: "facturation@journey.test.local"
          SMTP_HOST: "127.0.0.1"
          SMTP_PORT: "1025"
          SMTP_SECURE: "false"
          SMTP_REJECT_UNAUTHORIZED: "false"
          # Where the journey verifies ARRIVAL, over Mailpit's HTTP API.
          MAILPIT_API: "http://127.0.0.1:8025"
        run: |
          set -e
          KEY=$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')
          ANON=$(supabase status -o env | sed -n 's/^ANON_KEY=//p' | tr -d '"')
          if [ -z "$KEY" ]; then echo "::error::could not resolve SERVICE_ROLE_KEY"; exit 1; fi
          if [ -z "$ANON" ]; then echo "::error::could not resolve ANON_KEY"; exit 1; fi
          # The env guard requires the anon key even where the harness never uses
          # an anon client — it is validated at module load, not at first use.
          SUPABASE_SERVICE_ROLE_KEY="$KEY" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON"             npx vitest run --config vitest.journey.config.ts

      # ---- migration toolchain rehearsal (MIG-POLICY) ----------------------
      # Runs LAST, against the same disposable stack, because it deliberately
      # injects failures: bad SQL, a migration that applies but verifies false,
      # and one applied-but-unrecorded. It works in its own `rehearsal` schema
      # and throwaway directories, and removes its own ledger rows afterwards.
      #
      # It also MEASURES whether a multi-statement body is atomic on a late
      # failure rather than assuming it — the design deliberately does not
      # depend on that, but an operator should know the answer.
      - name: Migration toolchain rehearsal + failure injection
        run: node scripts/migration-rehearsal.mjs --db-url "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

      # The guard, against a database whose ledger the rehearsal has restored.
      # Proves it reports CLEAN on a consistent database — the case that must
      # not cry wolf, or the guard gets ignored when it finally matters.
      - name: Migration-integrity guard (read-only)
        run: node scripts/migration-integrity.mjs --db-url "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

      - name: Stop local Supabase
        if: always()
        run: supabase stop
