        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/rls_business_events_test.sql

      # This step surfaces psql's own message as a GitHub error annotation.
      # Workflow LOGS need repository admin rights to read through the API, so a
      # bare `exit 3` is undiagnosable to anyone without them; annotations are
      # readable by everyone who can see the run. The suite prints every check
      # value before asserting, so the annotation carries the actual numbers.
      - name: Run assignment history and visibility isolation test (Phase WES-3)
        env:
          PGPASSWORD: postgres
        run: |
          set +e
          out=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
                -f supabase/tests/rls_assignment_history_test.sql 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "::error::WES-3 RLS suite failed (psql exit $code): $(echo "$out" | tail -c 900 | tr '\n' ' | ')"
          fi
          exit $code

      # Same annotation pattern as the WES-3 step: workflow LOGS need repository
      # admin rights through the API, annotations do not. The suite prints every
      # check value as a NOTICE before asserting.
      - name: Run document governance and BAE isolation test (Phase WES-4)
        env:
          PGPASSWORD: postgres
        run: |
          set +e
          out=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
                -f supabase/tests/rls_document_governance_test.sql 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "::error::WES-4 RLS suite failed (psql exit $code): $(echo "$out" | tail -c 900 | tr '\n' ' | ')"
          fi
          exit $code

      - name: Run generated artifacts isolation test (Phase WES-4G)
        env:
          PGPASSWORD: postgres
        run: |
          set +e
          out=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/rls_generated_artifacts_test.sql 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "::error::WES-4G RLS suite failed (psql exit $code): $(echo "$out" | tail -c 900 | tr '\n' ' | ')"
          fi
          exit $code

      - name: Run process reconciliation isolation test (Phase WES-5)
        env:
          PGPASSWORD: postgres
        run: |
          set +e
          out=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/rls_process_reconciliation_test.sql 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "::error::WES-5 RLS suite failed (psql exit $code): $(echo "$out" | tail -c 900 | tr '\n' ' | ')"
          fi
          exit $code

      - name: Run official invoice artifact + charge uniqueness test (UAT-2B)
        env:
          PGPASSWORD: postgres
        run: |
          set +e
          out=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/rls_invoice_artifact_test.sql 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            # Surface the ERROR/NOTICE lines, not the tail. psql prints the
            # failing SQL context AFTER the error, so `tail` shows the dump and
            # hides the one line that says what actually went wrong.
            err=$(echo "$out" | grep -m1 -E '^(psql:.*)?ERROR:' | tr '\n' ' ')
            note=$(echo "$out" | grep -m1 'UAT-2B:' | tr '\n' ' ')
            echo "::error::UAT-2B invoice artifact suite failed (psql exit $code). ${err} ${note}"
          fi
          exit $code

      - name: Run Douane dossier discovery test
        env:
          PGPASSWORD: postgres
        run: |
          set +e
          out=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/rls_customs_discovery_test.sql 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            err=$(echo "$out" | grep -m1 -E '^(psql:.*)?ERROR:' | tr '\n' ' ')
            note=$(echo "$out" | grep -m1 'DOUANE:' | tr '\n' ' ')
            echo "::error::Douane discovery suite failed (psql exit $code). ${err} ${note}"
          fi
          exit $code

      # Newest suite runs LAST on purpose: a failing step aborts the job and skips
      # every later one, so a brand-new suite must never sit in front of the
      # established ones. Same annotation handling as Douane — psql prints the
      # failing SQL context AFTER the error, so surface the ERROR line itself
      # rather than leaving a bare "exit code 3".
      - name: Run RLS staff password lifecycle test (2026-07-29)
        env:
          PGPASSWORD: postgres
        run: |
