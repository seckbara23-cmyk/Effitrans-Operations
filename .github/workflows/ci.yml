            note=$(echo "$out" | grep -m1 'RLS STAFF PASSWORD FAIL' | tr '\n' ' ')
            echo "::error::Staff password lifecycle suite failed (psql exit $code). ${err} ${note}"
          fi
          exit $code

      - name: Stop local Supabase
        if: always()
        run: supabase stop
