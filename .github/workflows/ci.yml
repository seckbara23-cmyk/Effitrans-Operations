      - name: Run assignment history and visibility isolation test (Phase WES-3)
        env:
          PGPASSWORD: postgres
        run: |
          set +e
          out=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
                -f supabase/tests/rls_assignment_history_test.sql 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "::error::WES-3 RLS suite failed (psql exit $code): $(echo "$out" | tail -c 900 | tr '\n' ' | ')"
          fi
          exit $code

      # Same annotation pattern as the WES-3 step: workflow LOGS need repository
