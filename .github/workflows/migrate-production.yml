name: Migrate production

# MIG-POLICY — the ONLY sanctioned path for applying a migration to production.
#
# Manual dispatch only. Pushing code never applies anything: a human names one
# version and approves the protected environment. That separation is the point —
# the September 2026 ledger gap happened because applying was a thing someone
# did by hand, informally, with nothing checking afterwards.
#
# There is no break-glass input. An emergency may change WHO can approve the
# `production-db` environment; it never changes which steps run. Repository/
# ledger validation, verification, recording, post-record verification and the
# HELD behaviour apply identically to every run, always.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Migration version to apply (14 digits, e.g. 20261001000001)"
        required: true
        type: string
      dry_run:
        description: "Validate only — apply nothing, record nothing"
        required: false
        default: true
        type: boolean
      reason:
        description: "Why this is being deployed now (recorded in the run log)"
        required: true
        type: string

concurrency:
  # Two migrations at once is how a ledger and a schema disagree. Never cancel
  # in progress: interrupting between apply and record is the exact state this
  # whole workflow exists to prevent.
  group: migrate-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (read-only, no approval needed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate the requested version format
        run: |
          case "${{ inputs.version }}" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "::error::version must be exactly 14 digits"; exit 1 ;;
          esac
          echo "Requested: ${{ inputs.version }}"
          echo "Reason   : ${{ inputs.reason }}"

      - name: Lint migrations
        run: npm run lint:migrations

  migrate:
    name: Apply and record
    needs: preflight
    runs-on: ubuntu-latest
    # THE APPROVAL GATE. Reviewers on this environment are what stands between a
    # dispatch and production; the secrets live here and nowhere else.
    environment:
      name: production-db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.106.0

      # SUPABASE-LINK-PRIVILEGE-01 — `supabase link` is NOT used here, deliberately.
      #
      # It is a project-PROVISIONING fetch, not a context setter: on the pinned
      # CLI it calls four Management API endpoints (project detail, api-keys,
      # storage config, pooler config) and this runner consumes the result of
      # exactly one — the pooler address. On 2026-09-08 the account behind the
      # PAT was refused on one of them, `link` exited 1, and the integrity guard,
      # the dry run, the apply, the verifier and the ledger recording were all
      # skipped. A permission on an endpoint the runner never reads stopped a
      # migration from even being VALIDATED.
      #
      # Measured against production on this exact CLI version, with only
      # `project-ref` and `pooler-url` present: db query, migration list and the
      # integrity guard each make ZERO calls to api.supabase.com. `--linked` on
      # 2.106.0 is a direct Postgres connection through the pooler.
      #
      # So the requirement is removed rather than satisfied: no Supabase role is
      # expanded, no PAT replaced, no CLI upgraded, and the execution transport
      # is unchanged. SUPABASE_POOLER_URL carries NO password — the step refuses
      # one — and the CLI authenticates the pooler with SUPABASE_ACCESS_TOKEN.
      #
      # There is no fallback to `link` and none to the Management API: a fallback
      # would hide the very failure this exists to surface.
      - name: Establish project context (no Management API)
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
        run: node scripts/migration/link-context.mjs

      # Independent of the runner, and read-only: if the repository and ledger
      # already disagree, nothing should be applied on top of that.
      #
      # It used to assert `--expect-pending 1`, which assumed a migration is
      # always deployed alongside the code that needs it. Three accumulated and
      # the guard then refused every deployment, including the earliest and
      # correct one. The structural check — contiguous applied prefix, pending
      # suffix above it — is now always on, and ORDERING is enforced where it
      # belongs: the runner refuses any target that is not the earliest pending.
      - name: Migration-integrity guard (structural; ordering is the runner's)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/migration-integrity.mjs --linked

      - name: Dry run
        id: dry_run_step
        if: ${{ inputs.dry_run }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/migrate-production.mjs --linked --version "${{ inputs.version }}" --dry-run

      - name: Apply, verify, record, re-verify
        id: apply_step
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/migrate-production.mjs --linked --version "${{ inputs.version }}"

      # Runs even on failure: the operator needs to know WHICH state production
      # ended in, and that reading must come from the guard rather than from the
      # runner that just failed.
      # It used to end in `|| true`, which made a report that could not even RUN
      # look like a clean integrity check — and it did exactly that on
      # 2026-09-08, reporting success in a run where the project was never
      # linked. `continue-on-error` keeps the report from overriding the
      # migration's own result while leaving its true outcome readable, and the
      # step below turns a bad reading into a red run rather than a footnote.
      - name: Post-run integrity report
        id: post_integrity
        if: always()
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/migration-integrity.mjs --linked

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production migration"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| version | ${{ inputs.version }} |"
            echo "| mode | ${{ inputs.dry_run && 'DRY RUN' || 'APPLY' }} |"
            echo "| reason | ${{ inputs.reason }} |"
            echo "| actor | ${{ github.actor }} |"
            echo "| commit | ${{ github.sha }} |"
            echo "| MIGRATION RESULT | ${{ inputs.dry_run && steps.dry_run_step.outcome || steps.apply_step.outcome }} |"
            echo "| POST-RUN INTEGRITY RESULT | ${{ steps.post_integrity.outcome }} |"
            echo "| job status | ${{ job.status }} |"
            echo ""
            echo "The two results are SEPARATE. A migration can succeed while the"
            echo "post-run integrity reading fails, and that combination is the"
            echo "indeterminate state the policy calls \`VERIFY_FAILED\` or"
            echo "\`SCHEMA_AHEAD_OF_LEDGER\`: DDL may have run, the verifier may have"
            echo "failed, the ledger may not have been written. Read both rows."
          } >> "$GITHUB_STEP_SUMMARY"

      # A failed or unrunnable integrity report is a RED run. Last, so it can
      # never mask the migration step's own failure — that one has already
      # failed the job by the time this is reached.
      - name: Integrity report must have actually run
        if: ${{ always() && steps.post_integrity.outcome != 'success' }}
        run: |
          echo "::error title=post-run integrity did not pass::The migration result is reported separately above. The integrity report outcome was '${{ steps.post_integrity.outcome }}'. Production state is NOT confirmed clean by this run."
          exit 1
